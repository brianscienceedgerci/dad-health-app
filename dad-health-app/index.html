<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daily Coach</title>
<meta name="description" content="A simple, private weight-loss and healthy-habits coach.">
<meta name="theme-color" content="#F4511E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coach">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root {
  --bg: #F6F4F1; --card: #FFFFFF; --ink: #1B1B1B; --muted: #5E5A55; --line: #E4DFD8;
  --brand: #E8501C; --brand-ink: #FFFFFF; --brand-soft: #FDE7DE;
  --green: #2E8B3D; --yellow: #C98A00; --red: #D23B2F;
  --green-bg: #E3F3E5; --yellow-bg: #FFF3D1; --red-bg: #FBE2DF;
  --water: #1E7CC8; --shadow: 0 1px 3px rgba(0,0,0,.08);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121212; --card: #1E1E1E; --ink: #F2F2F2; --muted: #B3ADA6; --line: #34302C;
    --brand: #FF7043; --brand-ink: #1B1B1B; --brand-soft: #3A2419;
    --green: #5CC26B; --yellow: #F2B632; --red: #FF6B5E;
    --green-bg: #1C3320; --yellow-bg: #3A2F10; --red-bg: #3D1D1A;
    --water: #5AAEF0; --shadow: none;
  }
}
:root[data-theme="dark"] {
  --bg: #121212; --card: #1E1E1E; --ink: #F2F2F2; --muted: #B3ADA6; --line: #34302C;
  --brand: #FF7043; --brand-ink: #1B1B1B; --brand-soft: #3A2419;
  --green: #5CC26B; --yellow: #F2B632; --red: #FF6B5E;
  --green-bg: #1C3320; --yellow-bg: #3A2F10; --red-bg: #3D1D1A;
  --water: #5AAEF0; --shadow: none;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 19px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  overscroll-behavior-y: none;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 4px; }
h2 { font-size: 23px; margin: 0 0 10px; }
h3 { font-size: 20px; margin: 0; }
p { margin: 0 0 12px; }
.muted { color: var(--muted); }
.small { font-size: 16px; }

main { padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 100px); max-width: 560px; margin: 0 auto; }
.card { background: var(--card); border-radius: 18px; padding: 18px; margin-bottom: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }
.row { display: flex; align-items: center; gap: 12px; }
.row.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 58px; padding: 12px 18px;
  border-radius: 14px; border: none; background: var(--brand); color: var(--brand-ink); font-weight: 700; font-size: 20px; }
.btn.secondary { background: var(--brand-soft); color: var(--ink); }
.btn.ghost { background: transparent; border: 2px solid var(--line); color: var(--ink); }
.btn.danger { background: var(--red-bg); color: var(--red); }
.btn.sm { min-height: 48px; font-size: 18px; width: auto; }
.btn:active { transform: scale(.98); }
.icon-btn { width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--line); background: var(--card); font-size: 26px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; flex: none; }
.stack > * + * { margin-top: 10px; }

/* Date nav */
.datenav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.datenav .label { font-weight: 700; font-size: 20px; }

/* Calorie ring */
.ringwrap { display: flex; align-items: center; gap: 18px; }
.ring { position: relative; width: 150px; height: 150px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.ring .big { font-size: 36px; font-weight: 800; line-height: 1; }
.stat { font-size: 17px; }
.stat b { font-size: 22px; display: block; }

/* Color mix */
.mix { display: flex; height: 16px; border-radius: 8px; overflow: hidden; background: var(--line); margin: 14px 0 10px; }
.mix span { display: block; height: 100%; }
.pills { display: flex; gap: 8px; }
.pill { flex: 1; border-radius: 12px; padding: 8px 6px; text-align: center; font-size: 15px; line-height: 1.25; }
.pill b { display: block; font-size: 19px; }
.pill.G { background: var(--green-bg); } .pill.G b { color: var(--green); }
.pill.Y { background: var(--yellow-bg); } .pill.Y b { color: var(--yellow); }
.pill.R { background: var(--red-bg); } .pill.R b { color: var(--red); }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; display: inline-block; }
.dot.G { background: var(--green); } .dot.Y { background: var(--yellow); } .dot.R { background: var(--red); }

/* Meals */
.meal-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
.item { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: none; }
.item .name { font-weight: 600; }
.item .del { border: none; background: none; color: var(--muted); font-size: 26px; width: 44px; height: 44px; flex: none; }
.add-food { margin-top: 10px; }

/* Water */
.glasses { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.glass { flex: 1 1 0; min-width: 28px; max-width: 44px; height: 52px; border-radius: 8px 8px 12px 12px; border: 3px solid var(--water); background: transparent; padding: 0; }
.glass.full { background: var(--water); }

/* Tabs */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
nav.tabs button { flex: 1; border: none; background: none; padding: 10px 0 8px; font-size: 15px; font-weight: 600; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 68px; }
nav.tabs button svg { width: 28px; height: 28px; }
nav.tabs button.on { color: var(--brand); }

/* Sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 20; display: none; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 92vh; max-height: 92dvh; overflow-y: auto; background: var(--bg); z-index: 21;
  border-radius: 22px 22px 0 0; padding: 12px 16px calc(env(safe-area-inset-bottom) + 20px); display: none; max-width: 600px; margin: 0 auto;
  -webkit-overflow-scrolling: touch; }
.sheet.open, .sheet-bg.open { display: block; }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.close { border: none; background: var(--card); border-radius: 50%; width: 44px; height: 44px; font-size: 24px; border: 1px solid var(--line); }

input[type=text], input[type=number], input[type=search], select {
  width: 100%; min-height: 58px; padding: 12px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); font-size: 20px; }
input:focus, select:focus { outline: none; border-color: var(--brand); }
label.field { display: block; margin-bottom: 14px; }
label.field > span { display: block; font-weight: 600; margin-bottom: 6px; }
.food-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; margin-bottom: 8px; }
.food-row .name { font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 2px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 16px; font-weight: 600; min-height: 48px; }
.chip.on { border-color: var(--brand); background: var(--brand-soft); }
.stepper { display: flex; align-items: center; justify-content: center; gap: 20px; margin: 16px 0; }
.stepper .val { font-size: 36px; font-weight: 800; min-width: 90px; text-align: center; }
.choice { display: block; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
.choice.on { border-color: var(--brand); background: var(--brand-soft); }
.choice b { display: block; }
.section-title { font-size: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 8px; }

/* Lessons */
.lesson-row { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: var(--card); border: 1px solid var(--line);
  border-radius: 14px; padding: 14px; margin-bottom: 8px; }
.lesson-row .num { width: 40px; height: 40px; border-radius: 50%; background: var(--brand-soft); display: flex; align-items: center; justify-content: center; font-weight: 700; flex: none; }
.lesson-row .num.done { background: var(--green); color: #fff; }
.lesson-body p { font-size: 20px; }
.quiz-opt { display: block; width: 100%; text-align: left; background: var(--card); border: 2px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 10px; }
.quiz-opt.right { border-color: var(--green); background: var(--green-bg); }
.quiz-opt.wrong { border-color: var(--red); background: var(--red-bg); }

/* Progress */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats .card { margin: 0; text-align: center; padding: 14px 8px; }
.stats .v { font-size: 28px; font-weight: 800; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 12px; }

.onboard { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
.onboard .body { flex: 1; }
.progressbar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-bottom: 24px; }
.progressbar span { display: block; height: 100%; background: var(--brand); }
.hero { text-align: center; padding: 30px 0 10px; }
.hero img { width: 96px; height: 96px; border-radius: 22px; }

.toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 90px); transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 12px 20px; border-radius: 12px; font-weight: 600; z-index: 30; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
.banner { background: var(--brand-soft); border-radius: 14px; padding: 14px; margin-bottom: 14px; }
</style>
</head>
<body>
<main id="app"></main>
<nav class="tabs" id="tabs" hidden></nav>
<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>
<script src="data.js"></script>
<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
